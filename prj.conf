CONFIG_MICROROS=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=3

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_POSIX_API=y
CONFIG_POSIX_CLOCK=y
CONFIG_STATIC_INIT_GNU=y
# rmw_zenoh_pico with one publisher uses 20 pthread mutexes (from the upstream example)
CONFIG_MAX_PTHREAD_MUTEX_COUNT=160

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Entities of this application (compile-time limits of libmicroros)
CONFIG_MICROROS_NODES="1"
CONFIG_MICROROS_PUBLISHERS="1"
CONFIG_MICROROS_SUBSCRIBERS="0"
# Not used on Zenoh; the libmicroros module needs one transport selected
CONFIG_MICROROS_TRANSPORT_UDP=y

CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_RMW_ZENOH_PICO=y
# Features that zenoh-pico leaves off by default and rmw_zenoh_pico needs
CONFIG_ZENOH_PICO_LIVELINESS=y
CONFIG_ZENOH_PICO_INTEREST=y
CONFIG_ZENOH_PICO_FRAGMENTATION=y
CONFIG_ZENOH_PICO_ENCODING_VALUES=y
CONFIG_ZENOH_PICO_UNICAST_TRANSPORT=y
CONFIG_ZENOH_PICO_MATCHING=y
CONFIG_ZENOH_PICO_AUTO_RECONNECT=y
CONFIG_ZENOH_PICO_SESSION_CHECK=y
CONFIG_ZENOH_PICO_BATCHING=y
# Send every message at once. Without it Zephyr's TCP holds a small segment
# back while earlier data is unacknowledged (Nagle's algorithm), so the second
# of two publishes waits for a round trip of the first's acknowledgement
# (lingua_franca_ws/dual_publisher/runs/2026-11-19-transit-time).
CONFIG_ZENOH_PICO_TCP_NODELAY=y
# Read and lease run in one thread; the default reserves 4 stacks of CONFIG_MAIN_STACK_SIZE
CONFIG_ZENOH_PICO_THREADS_NUM=1

# Wi-Fi credentials come from ulf-uros.conf in the repository root (not
# committed); CMakeLists adds them. Do not write them here.
CONFIG_WIFI=y
CONFIG_WIFI_BOOTSTRAP=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_MAX_CONTEXTS=10
# zenoh-pico sets a receive timeout on its socket, which Zephyr rejects without this option
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_HEAP_MEM_POOL_SIZE=98304
